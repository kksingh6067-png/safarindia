<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafarIndia Admin Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            border: 0;
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-bar h2 {
            margin: 0;
        }

        .refresh-btn {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .table-wrapper {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f3f4f6;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .loading,
        .empty,
        .error {
            padding: 30px;
            text-align: center;
        }

        .error {
            color: #dc2626;
        }

    </style>

</head>

<body>

<header class="header">

    <div class="header-inner">

        <h1>
            SafarIndia Admin Panel
        </h1>

        <button
            id="logoutBtn"
            class="logout-btn">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="top-bar">

        <h2>
            Booking Enquiries
        </h2>

        <button
            id="refreshBtn"
            class="refresh-btn">
            Refresh
        </button>

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Destination</th>

                    <th>Travel Date</th>

                    <th>Travellers</th>

                    <th>Message</th>

                </tr>

            </thead>

            <tbody id="bookingTableBody">

                <tr>

                    <td
                        colspan="8"
                        class="loading">
                        Loading bookings...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>

</body>

</html>
